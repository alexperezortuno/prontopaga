server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=30s ipv6=off;

    include /etc/nginx/security/headers.conf;
    include /etc/nginx/security/restrictions.conf;

    # Keep Nginx-generated API errors generic and bodyless. Upstream Nest
    # errors are already sanitized by SEC-001.
    error_page 400 =400 @empty_400;
    error_page 401 =401 @empty_401;
    error_page 403 =403 @empty_403;
    error_page 404 =404 @empty_404;
    error_page 405 =405 @empty_405;
    error_page 413 =413 @empty_413;
    error_page 429 =429 @empty_429;
    error_page 502 =502 @empty_502;
    error_page 503 =503 @empty_503;
    error_page 504 =504 @empty_504;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/login {
        client_max_body_size 1m;
        limit_req zone=login burst=3 nodelay;
        limit_conn api_connections 20;
        limit_except POST OPTIONS { deny all; }

        set $api_upstream http://api:3000;
        proxy_pass $api_upstream/login;
        include /etc/nginx/security/proxy.conf;
    }

    location ^~ /api/ {
        client_max_body_size 1m;
        limit_req zone=api_general burst=20 nodelay;
        limit_conn api_connections 20;
        limit_except GET HEAD OPTIONS { deny all; }

        set $api_upstream http://api:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        include /etc/nginx/security/proxy.conf;
    }

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ /index.html;
    }

    location @empty_400 { return 204 ""; }
    location @empty_401 { return 204 ""; }
    location @empty_403 { return 204 ""; }
    location @empty_404 { return 204 ""; }
    location @empty_405 { return 204 ""; }
    location @empty_413 { return 204 ""; }
    location @empty_429 { return 204 ""; }
    location @empty_502 { return 204 ""; }
    location @empty_503 { return 204 ""; }
    location @empty_504 { return 204 ""; }
}
