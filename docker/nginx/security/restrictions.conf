server_tokens off;
autoindex off;

# Hide dot-files and common private or temporary artifacts without revealing
# whether a matching path exists.
location ~ /\.(?!well-known) {
    access_log off;
    log_not_found off;
    return 404 "";
}

location ~* \.(?:bak|conf|ini|log|sql|swp|swo|tmp|temp|map)$ {
    access_log off;
    log_not_found off;
    return 404 "";
}
